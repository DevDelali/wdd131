<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Places</title>
    <meta name="author" content="Nyakey Paul">
    <meta name="description" content="Places of a county where I would like to go in the future">
    <link rel="stylesheet" href="styles/place.css">
    <link rel="stylesheet" href="styles/places-large.css">
    <script src="styles/place.css" defer></script>

</head>

<body>
    <header>
        <h1> Greece</h1>
    </header>
    <main>

        <div>
            <picture>
                <source srcset="images/hero-large.webp" media="(min-width: 700px)">
                <source srcset="images/hero-medium.webp" media="(min-width: 500px)">
                <img src="images/hero-small.webp" alt="LDS Temple in Australia">
            </picture>
        </div>
        <div>
            <section>
                <h2>Data</h2>
                <ul>Area: </ul>
                <ul>Population: </ul>
                <ul>Capital</ul>
                <ul>Languages </ul>
                <ul>Currency: </ul>
                <ul>Time Zone: </ul>
                <ul>Calling Code: </ul>
                <ul>Internet TLD: </ul>
            </section>

            <section>
                <h2>Weather</h2>
                <ul>Temperature: </ul>
                <ul>Conditions: </ul>
                <ul>Wind: </ul>
                <ul>Wind Chill: </ul>
            </section>

        </div>
    </main>
    <footer>
        <p>© Nyakey Paul - <span id="currentyear"></span></p>
        <p id="lastModified"></p>
    </footer>

</body>

</html>
