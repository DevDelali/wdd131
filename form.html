<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
    <meta name="description" content="A page to test form elements and styling.">
    <meta name="author" content="Nyakey Paul">
    <link rel="stylesheet" href="styles/form.css">
    <link rel="stylesheet" href="styles/form-large.css">
    <script src="scripts/form.js" defer></script>
</head>

<body>
    <header>
        <h1>PRODUCT REVIEW</h1>
    </header>
    <main>

        <form method="get" action="review.html">

            <fieldset class="pdform">
                <legend>Product Review</legend>

                <label for="product">Product:</label>
                <select id="product" name="product" required>
                    <option value="">Please Select a Product</option>
                </select>

                <fieldset>
                    <legend>Overall Rating</legend>

                    <label><input type="radio" name="rating" value="1"> ☆</label>
                    <label><input type="radio" name="rating" value="2"> ☆☆</label>
                    <label><input type="radio" name="rating" value="3"> ☆☆☆</label>
                    <label><input type="radio" name="rating" value="4"> ☆☆☆☆</label>
                    <label><input type="radio" name="rating" value="5"> ☆☆☆☆☆</label>
                </fieldset>

                <label for="date">Date of Purchase*:</label>
                <input type="date" name="date" id="date" required>

                <fieldset>
                    <legend>What did you like about the product?</legend>

                    <label><input type="checkbox" name="features" value="quality"> Quality</label>
                    <label><input type="checkbox" name="features" value="price"> Price</label>
                    <label><input type="checkbox" name="features" value="design"> Design</label>
                    <label><input type="checkbox" name="features" value="comfort"> Comfort</label>
                    <label><input type="checkbox" name="features" value="durability"> Durability</label>
                </fieldset>

                <label for="suggestions">Comments About the Product (Optional):</label>
                <textarea id="suggestions" name="suggestions"></textarea>

                <label for="name">Your Name (Optional):</label>
                <input type="text" id="name" name="name">

                <input type="submit" value="Submit Review">

            </fieldset>

        </form>

    </main>
    <footer>
        <p>© Nyakey Paul - <span id="currentyear"></span></p>
        <p id="lastModified"></p>
    </footer>

</body>

</html>
