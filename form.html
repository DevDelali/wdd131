<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review Form</title>
    <meta name="description"
        content="A responsive page to test form elements and styling using html , css and javascipt.">
    <meta name="author" content="Nyakey Paul">
    <link rel="stylesheet" href="styles/form.css">
    <link rel="stylesheet" href="styles/form-large.css">
    <script src="scripts/form.js" defer></script>
</head>

<body>
    <header>
        <h1>PRODUCT REVIEW</h1>
    </header>
    <main>

        <form method="get" action="review.html">

            <fieldset class="pdform">
                <legend>Product Review</legend>

                <label for="product">Product:</label>
                <select id="product" name="product" required>
                    <option value="" disabled selected>Please Select a Product</option>
                </select>

                <fieldset>
                    <legend>Overall Rating</legend>

                    <label for="rating1"><input type="radio" id="rating1" name="rating" value="1" required> ☆</label>
                    <label for="rating2"><input type="radio" id="rating2" name="rating" value="2" required> ☆☆</label>
                    <label for="rating3"><input type="radio" id="rating3" name="rating" value="3" required> ☆☆☆</label>
                    <label for="rating4"><input type="radio" id="rating4" name="rating" value="4" required> ☆☆☆☆</label>
                    <label for="rating5"><input type="radio" id="rating5" name="rating" value="5" required>
                        ☆☆☆☆☆</label>
                </fieldset>

                <label for="date">Date of Purchase*:</label>
                <input type="date" name="date" id="date" required>

                <fieldset>
                    <legend>What did you like about the product?</legend>

                    <label for="quality"><input type="checkbox" id="quality" name="features" value="quality">
                        Quality</label>
                    <label for="price"><input type="checkbox" id="price" name="features" value="price"> Price</label>
                    <label for="design"><input type="checkbox" id="design" name="features" value="design">
                        Design</label>
                    <label for="comfort"><input type="checkbox" id="comfort" name="features" value="comfort">
                        Comfort</label>
                    <label for="durability"><input type="checkbox" id="durability" name="features" value="durability">
                        Durability</label>
                </fieldset>

                <label for="suggestions">Comments About the Product (Optional):</label>
                <textarea id="suggestions" name="suggestions"></textarea>

                <label for="name">Your Name (Optional):</label>
                <input type="text" id="name" name="name">

                <input type="submit" value="Submit Review">

            </fieldset>

        </form>

    </main>
    <footer>
        <p>© Nyakey Paul - <span id="currentyear"></span></p>
        <p id="lastModified"></p>
    </footer>

</body>

</html>
